<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Profile System</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    
    .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    
    /* Profile Photo Circle UI */
    .avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 20px; }
    .avatar-circle { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #3b82f6; overflow: hidden; cursor: pointer; background: #334155; display: flex; align-items: center; justify-content: center; position: relative; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-placeholder { font-size: 40px; color: #94a3b8; }
    
    /* Triangular Action Badge */
    .badge-btn { position: absolute; bottom: 2px; right: 2px; background: #3b82f6; border: 2px solid #1e293b; color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; clip-path: polygon(100% 0, 0 100%, 100% 100%); padding-top: 6px; padding-left: 6px; }

    /* Popup Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 85%; max-width: 300px; text-align: center; }
    .menu-btn { width: 100%; padding: 12px; margin: 6px 0; background: #334155; border: none; color: white; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .menu-btn.delete { color: #ef4444; }

    #lightbox-img { max-width: 90%; max-height: 80vh; border-radius: 10px; }

    /* Input & Button */
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; outline: none; }
    
    .submit-btn { width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: not-allowed; opacity: 0.5; }
    .submit-btn.active { opacity: 1; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Profile Setup</h2>

    <!-- Avatar Circle & Tikona Badge -->
    <div class="avatar-wrapper">
      <div class="avatar-circle" onclick="openLightbox()">
        <span id="placeholder" class="avatar-placeholder">👤</span>
        <img id="profile-img" src="" alt="Profile">
      </div>
      <div class="badge-btn" onclick="openPhotoOptions(event)">▲</div>
    </div>

    <!-- User ID Input -->
    <div class="input-group">
      <label>User ID (e.g., abcd.12)</label>
      <input type="text" id="userid" placeholder="abcd.12" oninput="checkFormValidity()">
    </div>

    <button id="create-btn" class="submit-btn" disabled onclick="finishAccountCreation()">Create Profile</button>
  </div>

  <!-- Photo Options Popup Modal -->
  <div id="options-modal" class="modal" onclick="closeModal('options-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h4 style="margin-top:0">Profile Photo Options</h4>
      <button class="menu-btn" onclick="triggerCamera()">📸 Take Photo (Camera)</button>
      <button class="menu-btn" onclick="triggerGallery()">📁 Choose from Gallery</button>
      <button id="delete-btn" class="menu-btn delete" onclick="deletePhoto()" style="display:none">🗑️ Delete Photo</button>
    </div>
  </div>

  <!-- Lightbox Modal (Full Photo View) -->
  <div id="lightbox-modal" class="modal" onclick="closeModal('lightbox-modal')">
    <img id="lightbox-img" src="" alt="Full Preview">
  </div>

  <!-- Hidden File Inputs -->
  <input type="file" id="file-input-gallery" accept="image/*" style="display:none" onchange="processImage(event)">
  <input type="file" id="file-input-camera" accept="image/*" capture="user" style="display:none" onchange="processImage(event)">

  <script>
    let currentPhotoData = null;

    // Open Options Menu on Tikona Badge Click
    function openPhotoOptions(e) {
      e.stopPropagation();
      document.getElementById('delete-btn').style.display = currentPhotoData ? 'flex' : 'none';
      document.getElementById('options-modal').style.display = 'flex';
    }

    function triggerCamera() {
      closeModal('options-modal');
      document.getElementById('file-input-camera').click();
    }

    function triggerGallery() {
      closeModal('options-modal');
      document.getElementById('file-input-gallery').click();
    }

    // Process & Compress Image
    function processImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const max_size = 400; // Compressed resolution
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > max_size) { height *= max_size / width; width = max_size; }
            } else {
              if (height > max_size) { width *= max_size / height; height = max_size; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            currentPhotoData = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('profile-img').src = currentPhotoData;
            document.getElementById('profile-img').style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // Delete Photo Logic
    function deletePhoto() {
      currentPhotoData = null;
      document.getElementById('profile-img').src = '';
      document.getElementById('profile-img').style.display = 'none';
      document.getElementById('placeholder').style.display = 'block';
      closeModal('options-modal');
    }

    // Lightbox Logic (Full View on Circle Click)
    function openLightbox() {
      if (currentPhotoData) {
        document.getElementById('lightbox-img').src = currentPhotoData;
        document.getElementById('lightbox-modal').style.display = 'flex';
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Enable button only when valid ID (abcd.12 format) is entered
    function checkFormValidity() {
      const userid = document.getElementById('userid').value.trim();
      const createBtn = document.getElementById('create-btn');
      
      const isUseridValid = /^(?=.*[0-9.]).{5,10}$/.test(userid);

      if (isUseridValid) {
        createBtn.disabled = false;
        createBtn.classList.add('active');
      } else {
        createBtn.disabled = true;
        createBtn.classList.remove('active');
      }
    }

    // Save Profile to LocalStorage
    function finishAccountCreation() {
      const userid = document.getElementById('userid').value.trim().toLowerCase();
      
      const userProfile = {
        userid: userid,
        photo: currentPhotoData || null
      };

      localStorage.setItem('my_profile', JSON.stringify(userProfile));
      alert('🎉 प्रोफ़ाइल सफलतापूर्वक सेव हो गई है!');
    }
  </script>
</body>
</html>
